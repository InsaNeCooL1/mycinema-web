name: Build MyCinema WEB APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-web-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-web-

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Prepare Web Folder (PWA assets included)
        run: |
          mkdir -p www/icons
          cp index.html www/
          cp styles.css www/
          cp bundle.js www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp icons/*.png www/icons/

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PMC_VERSION_CODE=${{ github.run_number }} -PMC_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/mycinema-web-debug.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mycinema-web-build-${{ github.run_number }}
          name: MyCinema WEB Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/mycinema-web-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

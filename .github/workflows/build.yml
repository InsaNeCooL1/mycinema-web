name: Build WEB
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycinema-web
          path: |
            index.html
            player.html
            styles.css
            bundle.js
